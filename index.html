<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f5f0e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon.svg">
<title>Khảo sát hiện trường</title>
<style>
  /* Giao diện theo bộ LeHai Tools (projects/lehai-tools/LeHai_Tools/shared/lehai_theme.css): kem + walnut + amber.
     Font: Be Vietnam Pro tự chứa (fonts/, chạy offline) — DM Sans của bộ LeHai thiếu dải chữ Việt ạ ấ ầ ẩ ậ ắ ặ ẹ ế ệ… */
  @font-face { font-family: 'Be Vietnam Pro'; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/bvp-400-vietnamese.woff2) format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
  @font-face { font-family: 'Be Vietnam Pro'; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/bvp-400-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Be Vietnam Pro'; font-style: normal; font-weight: 500; font-display: swap; src: url(fonts/bvp-500-vietnamese.woff2) format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
  @font-face { font-family: 'Be Vietnam Pro'; font-style: normal; font-weight: 500; font-display: swap; src: url(fonts/bvp-500-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Be Vietnam Pro'; font-style: normal; font-weight: 600; font-display: swap; src: url(fonts/bvp-600-vietnamese.woff2) format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
  @font-face { font-family: 'Be Vietnam Pro'; font-style: normal; font-weight: 600; font-display: swap; src: url(fonts/bvp-600-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Be Vietnam Pro'; font-style: normal; font-weight: 700; font-display: swap; src: url(fonts/bvp-700-vietnamese.woff2) format('woff2'); unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB; }
  @font-face { font-family: 'Be Vietnam Pro'; font-style: normal; font-weight: 700; font-display: swap; src: url(fonts/bvp-700-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  :root {
    --bg: #f5f0e8; --surface: #ffffff; --cream: #fbf7f1;
    --line: #ece2d5; --line-2: #dfd0bd;
    --ink: #1c0a00; --ink-2: #6b4226; --ink-3: #a08060;
    --walnut: #7c2d12; --accent: #b45309; --accent-2: #92400e; --accent-ink: #ffffff; --accent-soft: #fef3c7;
    --fill: rgba(124,45,18,.06);
    --good: #15803d; --good-soft: #e9f4ec; --warn: #a16207; --warn-soft: #fdf2d8; --bad: #b91c1c; --bad-soft: #fbe9e7;
    --r: 14px; --r-sm: 10px; --hdr: 58px;
    --shadow: 0 1px 3px rgba(28,10,0,.07), 0 0 0 1px rgba(28,10,0,.05);
    --font: 'Be Vietnam Pro', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, "Roboto Mono", monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font: 15px/1.5 var(--font);
    color: var(--ink); background: var(--bg);
    max-width: 480px; margin: 0 auto; -webkit-font-smoothing: antialiased;
    min-height: 100dvh; display: flex; flex-direction: column;
  }
  body.fit { height: 100dvh; overflow: hidden; }
  body.fit main { min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
  body.fit .plan { flex: 1 1 auto; height: auto; aspect-ratio: auto; max-height: none; min-height: 120px; margin-bottom: 8px; }
  .ctl { flex: 0 0 auto; }
  body.split { height: 100dvh; overflow: hidden; }
  body.split main { min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding-bottom: 0; }
  body.split main > .tabbar { flex: 0 0 auto; }
  body.split main > .plan, body.split main > .elev { flex: 0 0 auto; height: 36dvh; min-height: 150px; max-height: none; aspect-ratio: auto; margin-bottom: 8px; }
  body.split .pane { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; margin: 0 -16px; padding: 2px 16px calc(24px + env(safe-area-inset-bottom)); }
  body.split .display { font-size: 24px; padding: 4px; }
  body.split .keypad { gap: 6px; margin-bottom: 8px; }
  body.split .keypad button { height: 42px; }
  .hint { font-size: 12.5px; color: var(--ink-2); text-align: center; line-height: 1.45; margin: 4px 8px 8px; }
  .hint b { color: var(--ink); font-weight: 600; }
  /* Thanh trên: nền kem, dòng thương hiệu nhỏ màu amber như tiêu đề cụm của bảng LeHai */
  header {
    position: sticky; top: 0; z-index: 6; flex: 0 0 auto;
    background: rgba(245,240,232,.93); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    padding: env(safe-area-inset-top) 12px 0; min-height: calc(var(--hdr) + env(safe-area-inset-top));
    display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--line);
  }
  header .back { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    font-size: 26px; line-height: 1; cursor: pointer; color: var(--walnut); margin-left: -4px; padding-bottom: 3px; }
  header .back:active { background: var(--fill); }
  header .ttl { flex: 1; min-width: 0; margin-left: 4px; }
  header .brand { font-size: 9.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); line-height: 1.2; }
  header h1 { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: -.2px; line-height: 1.3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  main { flex: 1 1 auto; padding: 14px 16px calc(40px + env(safe-area-inset-bottom)); }
  .card { background: var(--surface); border-radius: var(--r); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .muted { color: var(--ink-2); }
  .row { display: flex; gap: 8px; align-items: center; }
  h2 { font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 10px 2px 10px; }
  h3 { font-size: 15px; font-weight: 700; color: var(--ink); margin: 0 0 10px; letter-spacing: -.1px; }
  label { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin: 16px 2px 7px; }
  input[type=text], input[type=number], input[type=date], .seg select {
    width: 100%; height: 48px; padding: 0 14px; border: 1.5px solid var(--line-2); border-radius: var(--r-sm);
    font: inherit; font-size: 16px; background: var(--surface); color: var(--ink); -webkit-appearance: none; appearance: none;
  }
  input[type=number] { font-family: var(--mono); font-size: 16px; }
  input::placeholder { color: #c4ad95; font-family: var(--font); }
  input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(180,83,9,.15); }
  input:disabled { background: var(--cream); color: var(--ink-3); }
  button { font: inherit; cursor: pointer; border: none; border-radius: var(--r-sm); color: inherit; transition: background .15s ease, transform .05s ease, filter .12s; }
  button:active { transform: translateY(1px); }
  .btn { display: block; width: 100%; min-height: 50px; padding: 12px 16px; background: var(--walnut); color: #fff; font-weight: 700; font-size: 15px; border-radius: var(--r); }
  .btn.accent { background: var(--accent); color: var(--accent-ink); }
  .btn.accent:active { filter: brightness(.94); }
  .btn.ghost { background: var(--surface); color: var(--walnut); border: 1.5px solid var(--line-2); }
  .btn.ghost:active { background: var(--cream); border-color: var(--accent); }
  .btn.small { display: inline-block; width: auto; min-height: 40px; padding: 8px 14px; font-size: 13.5px; border-radius: var(--r-sm); }
  .btn.danger { background: var(--surface); color: var(--bad); border: 1.5px solid #f0c7c2; }
  .btn[disabled] { opacity: .35; }
  .btn + .btn { margin-top: 0; }
  main > .btn { margin-bottom: 10px; }
  .list-item { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 15px 16px; border-radius: var(--r); margin-bottom: 9px; background: var(--surface); box-shadow: var(--shadow); cursor: pointer; }
  .list-item:active { background: var(--cream); }
  .list-item .t { font-weight: 700; font-size: 15.5px; }
  .list-item .s { font-size: 13px; color: var(--ink-3); margin-top: 2px; }
  .chev { color: var(--accent); font-size: 22px; line-height: 1; }
  .empty { text-align: center; color: var(--ink-3); padding: 34px 14px; line-height: 1.7; border: 1.5px dashed var(--line-2); border-radius: var(--r); margin-bottom: 12px; background: var(--cream); }
  /* Khung hình: tỉ lệ khớp khung vẽ (VW×VH) nên hình không bị chừa trống trên dưới */
  .plan { width: 100%; aspect-ratio: 340 / 360; max-height: 64vh; min-height: 280px; background: var(--surface);
    border-radius: var(--r); display: block; touch-action: none; margin-bottom: 12px; box-shadow: var(--shadow); }
  .elev { width: 100%; aspect-ratio: 6 / 5; max-height: 56vh; background: var(--surface); border-radius: var(--r); display: block; margin-bottom: 10px; touch-action: none; box-shadow: var(--shadow); }
  .banner { padding: 11px 14px; border-radius: var(--r-sm); margin: 0 0 12px; font-size: 13.5px; line-height: 1.5; }
  .banner.info { background: var(--fill); color: var(--ink-2); }
  .banner.warn { background: var(--warn-soft); color: #7a4b06; }
  .banner.bad { background: var(--bad-soft); color: #8f1d1d; }
  .banner b { font-weight: 700; }
  .banner a { color: var(--accent); font-weight: 700; }
  /* Kết quả khép hình / kiểm tra: dòng gọn có chấm màu, không khối màu đặc */
  .status { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--r);
    background: var(--surface); box-shadow: var(--shadow); margin: 0 0 12px; }
  .status .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  .status .n { font-size: 22px; font-weight: 700; font-family: var(--mono); letter-spacing: -.5px; }
  .status .lbl { font-size: 14px; color: var(--ink-2); }
  .display { text-align: center; font-size: 28px; font-weight: 600; font-family: var(--mono); padding: 8px;
    border-radius: var(--r-sm); background: var(--cream); border: 1.5px solid var(--line); margin-bottom: 10px; color: var(--ink); letter-spacing: -.5px; }
  .display .u { font-size: 14px; color: var(--ink-3); font-weight: 500; margin-left: 6px; font-family: var(--font); }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .keypad button { height: 52px; font-size: 21px; font-weight: 500; font-family: var(--mono);
    background: var(--surface); border: 1.5px solid var(--line); color: var(--ink); }
  .keypad button:active { background: var(--accent-soft); border-color: var(--accent); }
  .toolrow { display: flex; gap: 8px; }
  .toolrow > * { flex: 1; }
  .toolrow .btn { min-height: 48px; padding: 10px 12px; font-size: 14px; }
  .dpad { display: grid; grid-template-columns: repeat(3, 64px); gap: 8px; justify-content: center; margin: 6px auto 12px; }
  .dpad button { width: 64px; height: 64px; font-size: 24px; font-weight: 600; background: var(--surface);
    border: 1.5px solid var(--line-2); color: var(--walnut); border-radius: 18px; touch-action: none; user-select: none; -webkit-user-select: none; }
  .dpad button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .dpad .sp { visibility: hidden; }
  /* Tab trong 1 phòng — kiểu chip của bảng LeHai. KHÔNG sticky: dính thì che mép trên hình, chạm góc A trúng tab. */
  .tabbar { display: flex; gap: 6px; margin: 0 0 14px; }
  .tabbar button { flex: 1; height: 38px; font-size: 13.5px; font-weight: 600; background: var(--surface); color: var(--ink-2);
    border: 1.5px solid var(--line); border-radius: 999px; }
  .tabbar button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-2); }
  /* Đồ vật (dòng danh sách) */
  .obj { display: flex; align-items: center; gap: 12px; padding: 12px 12px; border-radius: var(--r-sm); background: var(--surface);
    border: 1.5px solid var(--line); margin-bottom: 8px; cursor: pointer; }
  .obj:active { background: var(--cream); border-color: var(--accent); }
  .obj .ic { font-size: 17px; width: 26px; text-align: center; color: var(--walnut); flex: 0 0 auto; }
  .obj .t { font-weight: 600; font-size: 14.5px; }
  .obj .s { font-size: 13px; color: var(--ink-3); margin-top: 1px; font-variant-numeric: tabular-nums; }
  .card .obj { background: var(--cream); }
  .obj .warnDot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); vertical-align: middle; margin-left: 6px; }
  .picker { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .picker button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 66px; padding: 8px 2px;
    background: var(--cream); border: 1.5px solid var(--line); color: var(--ink); font-size: 11.5px; font-weight: 500; line-height: 1.2; }
  .picker button .ic { font-size: 18px; color: var(--walnut); }
  .picker button:active { background: var(--accent-soft); border-color: var(--accent); }
  /* Ảnh: ẩn ô file mặc định, bấm nút gọn */
  .photo { display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 14px; border-radius: var(--r-sm); background: var(--surface);
    border: 1.5px dashed var(--line-2); color: var(--ink-2); font-size: 13.5px; font-weight: 600; cursor: pointer; margin: 0; }
  .photo:active { background: var(--accent-soft); border-color: var(--accent); }
  .photo input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .photo .plus { font-size: 18px; line-height: 1; color: var(--accent); }
  .cam { position: fixed; inset: 0; background: #000; z-index: 50; display: flex; flex-direction: column; }
  .cam video { flex: 1; min-height: 0; width: 100%; object-fit: contain; background: #000; }
  .cam-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px calc(18px + env(safe-area-inset-bottom)); }
  .cam-bar .btn { width: auto; min-height: 44px; padding: 8px 18px; color: #fff; background: transparent; border: 1px solid rgba(255,255,255,.45); }
  .shutter { width: 74px; height: 74px; border-radius: 50%; border: 4px solid #fff; background: rgba(255,255,255,.22); padding: 0; }
  .shutter:active { background: #fff; }
  .cam-n { color: #fff; font-size: 14px; min-width: 70px; text-align: right; font-family: var(--mono); }
  .cam-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .12s; }
  .thumbs { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .thumbs .tm { position: relative; }
  .thumbs img { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; border: 1.5px solid var(--line); display: block; }
  .thumbs .x { position: absolute; top: -7px; right: -7px; width: 24px; height: 24px; border-radius: 50%;
    background: var(--walnut); color: #fff; font-size: 12px; line-height: 24px; text-align: center; cursor: pointer; }
  .chk { display: flex; align-items: flex-start; gap: 12px; padding: 12px 2px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .chk:first-child { padding-top: 2px; }
  .chk:last-child { border-bottom: none; padding-bottom: 2px; }
  .chk .m { width: 9px; height: 9px; border-radius: 50%; margin-top: 7px; flex: 0 0 auto; }
  .chk.ok .m { background: var(--good); }
  .chk.warn .m { background: var(--warn); }
  .chk .lbl { font-weight: 700; }
  .chk .dt { color: var(--ink-2); }
  .seg { display: flex; gap: 8px; align-items: center; }
  .seg select { flex: 1; background-image: linear-gradient(45deg, transparent 50%, var(--walnut) 50%), linear-gradient(135deg, var(--walnut) 50%, transparent 50%);
    background-position: calc(100% - 18px) 21px, calc(100% - 13px) 21px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
  .lt { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; margin: 16px 2px 7px; }
  .lt label { margin: 0; }
  .tg { display: inline-flex; flex: 0 0 auto; border: 1.5px solid var(--line-2); border-radius: var(--r-sm); overflow: hidden; background: var(--surface); }
  .tg button { border-radius: 0; background: transparent; padding: 0 12px; min-height: 34px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
  .tg button + button { border-left: 1.5px solid var(--line-2); }
  .tg button.on { background: var(--walnut); color: #fff; }
  .tg.wide { display: flex; width: 100%; }
  .tg.wide button { flex: 1; min-height: 44px; padding: 4px 8px; line-height: 1.25; }
  .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .actions .row .btn { flex: 1; }
  .foot { font-size: 12px; color: var(--ink-3); text-align: center; margin: 14px 8px 0; line-height: 1.5; }
  ::selection { background: var(--accent-soft); }
</style>
</head>
<body>
<header>
  <span class="back" id="backBtn" style="display:none" onclick="App.back()">‹</span>
  <div class="ttl"><div class="brand">LeHai's Decor · Khảo sát</div><h1 id="title">Khảo sát hiện trường</h1></div>
</header>
<main id="app"></main>

<script src="js/geometry.js"></script>
<script src="js/danh-muc.js"></script>
<script src="js/dxf.js"></script>
<script>
var App = (function () {
  'use strict';
  var KEY = 'khao-sat-v0';
  var G = window.Geometry;
  var VW = 340, VH = 360;          // khung mặt bằng (khớp aspect-ratio của .plan trong CSS)
  var EW = 360, EH = 300;          // khung mặt đứng tường
  var PAD = 34;                    // lề quanh hình mặt bằng/trần (drawPlan và ceilTransform PHẢI dùng chung)
  var state = { screen: 'home', projectId: null, roomId: null, tab: 'plan',
    selEdge: null, pendingVal: '', wallIdx: null, objId: null, objKind: null, ceilPlace: null, addOpen: false,
    zoneMode: false, zonePts: [], zoneSel: null, zoneTwo: false, zoneEdgeSel: null,
    zActive: 0, // vùng tự vẽ: đang điền góc neo nào (0/1)
    // zAnc: 2 GÓC MẢNG. Mỗi góc = 2 số đo (m), mỗi số đo tham chiếu 'corner' (góc phòng) hoặc
    // 'edge' (cạnh tường, d=0 nghĩa nằm trên cạnh); side chọn 1 trong 2 nghiệm giao.
    zAnc: [
      { m: [{ ref: 'corner', idx: 0, d: '' }, { ref: 'corner', idx: 1, d: '' }], side: 1 },
      { m: [{ ref: 'corner', idx: 0, d: '' }, { ref: 'corner', idx: 1, d: '' }], side: 1 }
    ] };
  var snake = { legDir: null, legLen: 0, activeDir: null, raf: null, last: 0, mode: 'sketch' };
  var SDIR = { U: { x: 0, y: -1 }, D: { x: 0, y: 1 }, L: { x: -1, y: 0 }, R: { x: 1, y: 0 } };
  var OPP = { U: 'D', D: 'U', L: 'R', R: 'L' };

  function planSvg() { return '<svg class="plan" id="plan" viewBox="0 0 ' + VW + ' ' + VH + '" preserveAspectRatio="xMidYMid meet" onpointerdown="App.planTap(event)" onclick="App.planClick(event)"></svg>'; }

  // ---------- TAB: Mặt bằng ----------
  function tabPlan(r) {
    var miss = G.missingCount(r.edges);
    var statusHtml = miss > 0
      ? '<div class="banner warn">Còn <b>' + miss + '/' + r.edges.length + '</b> cạnh chưa có số đo — chạm vào cạnh (nét đỏ) để nhập.</div>'

          '<div class="toolrow" style="margin-top:10px"><button class="btn ghost" onclick="App.shapeInsert(true)">+ Bậc: phía ' + endL + ' thụt vào</button>' +
          '<button class="btn ghost" onclick="App.shapeInsert(false)">+ Bậc: phía ' + endL + ' lồi ra</button></div>' +
          (step
            ? '<div class="toolrow" style="margin-top:8px"><button class="btn ghost" onclick="App.shapeFlip()">Đảo bậc này vào ↔ ra</button><button class="btn danger" onclick="App.shapeDelete()">Xoá bậc này</button></div>'
            : '<div class="muted" style="font-size:12px;margin-top:8px">Muốn xoá hoặc đảo chiều một bậc: chạm vào chính đoạn bậc ngắn đó.</div>') +
          '<button class="btn ghost small" style="margin-top:10px" onclick="App.shapeToggle()">Đóng</button></div>'
        : '<button class="btn ghost small" style="margin:0 0 12px" onclick="App.shapeToggle()">Vẽ sai cạnh này? Sửa hình tại đây ▸</button>';
      editor =
        '<div class="card"><div class="muted" style="font-size:12px;margin-bottom:6px">Cạnh ' + wallName(i) + ' (' + (e.axis === 'H' ? 'ngang' : 'dọc') + ') — gõ là hiện lên hình, chạm cạnh khác để đo tiếp.</div>' +
        '<div class="display">' + (state.pendingVal || '0') + '<span class="u">mm</span></div>' +
        '<div class="keypad">' + ['7','8','9','4','5','6','1','2','3','0','.','⌫'].map(function (k) { return '<button onclick="App.key(\'' + k + '\')">' + k + '</button>'; }).join('') + '</div>' +
        '<div class="toolrow">' +

    }

    return planSvg() + statusHtml + editor + floorCard(r) + skirtCard(r) + diagCard(r) +

  // Đồ trên sàn: thoát sàn, cấp nước, cột... — vị trí TÂM đo từ 2 tường.
  function floorCard(r) {
    if (G.missingCount(r.edges) > 0) return '';
    var objs = (r.objects || []).filter(function (o) { return o.floor; });
    return '<div class="card"><h3>Đồ trên sàn' + (objs.length ? ' (' + objs.length + ') — chạm để sửa' : '') + '</h3>' +
      objs.map(ceilRow).join('') + (objs.length ? '<div style="height:10px"></div>' : '') +
      '<div class="picker">' + Object.keys(FKINDS).map(function (k) { return '<button onclick="App.pickFloor(\'' + k + '\')"><span class="ic">' + FKINDS[k].ic + '</span>' + FKINDS[k].ten + '</button>'; }).join('') + '</div></div>';
  }
  // Len chân tường: 1 bộ số cho cả phòng (cao × dày), tường nào không chạy len thì tắt ở mặt đứng tường đó.
  function skirtOn(r) { return !!(r.skirt && num(r.skirt.h) > 0); }
  // Tổng dài len = tổng các tường có len trừ bề rộng cửa trên tường đó (mm).
  function skirtLen(r) {
    if (!skirtOn(r) || G.missingCount(r.edges) > 0) return null;
    var s = 0;
    r.edges.forEach(function (e, i) {
      if (e.noSkirt) return;
      var doors = wallObjs(r, i).filter(function (o) { return o.kind === 'door'; }).reduce(function (a, o) { return a + (num(o.w) || 0); }, 0);
      s += Math.max(0, Number(e.mm) - doors);
    });
    return s;
  }
  function skirtCard(r) {
    var sk = r.skirt || {}, L = skirtLen(r), off = r.edges.filter(function (e) { return e.noSkirt; }).length;
    return '<div class="card"><h3>Len chân tường</h3>' +
      '<div class="muted" style="font-size:12.5px">Phòng có len thì điền cao + dày; để trống = không có len. Tường nào không chạy len thì tắt ở mặt đứng tường đó; cửa tự trừ.</div>' +
      '<div class="seg"><div style="flex:1"><label style="margin-top:8px">Cao (mm)</label><input type="number" placeholder="VD: 100" value="' + (sk.h || '') + '" onchange="App.setSkirt(\'h\',this.value)"></div>' +
      '<div style="flex:1"><label style="margin-top:8px">Dày (mm)</label><input type="number" placeholder="VD: 10" value="' + (sk.t || '') + '" onchange="App.setSkirt(\'t\',this.value)"></div></div>' +
      (L != null ? '<div class="muted" style="font-size:12.5px;margin-top:8px">Tổng dài len ≈ <b>' + (L / 1000).toFixed(2) + ' m</b> (đã trừ cửa' + (off ? ', bỏ ' + off + ' tường tắt len' : '') + ').</div>' : '') + '</div>';
  }
  function diagCard(r) {
    if (G.missingCount(r.edges) > 0) return '';
    r.diagonals = r.diagonals || [];
    var opts = r.edges.map(function (_, i) { return '<option value="' + i + '">' + letter(i) + '</option>'; }).join('');
    var rows = r.diagonals.map(function (d, i) {
      var calc = G.cornerDistance(r.edges, d.from, d.to);
      var meas = num(d.measured);
      var line = letter(d.from) + '→' + letter(d.to) + ': hình ' + Math.round(calc) + 'mm';
      var tag = '';
      if (meas != null && calc != null) { var diff = Math.round(Math.abs(meas - calc));
        line += ' · đo ' + meas + 'mm'; tag = ' <b style="color:' + (diff <= 15 ? 'var(--good)' : 'var(--bad)') + '">lệch ' + diff + 'mm</b>'; }
      return '<div class="obj"><div class="ic">╲</div><div style="flex:1"><div class="t">' + line + tag + '</div></div>' +
        '<button class="btn ghost small" onclick="App.delDiag(' + i + ')">✕</button></div>';

  // được và tự chuyển sang kho lúc mở app. Không có IndexedDB (vd file:// một số máy) thì lưu kiểu cũ.
  var PH = {}, PDB = null;

        cur.onerror = function () { cb(); };

  // Xếp nhãn số cạnh + chữ góc KHÔNG ĐÈ NHAU (toạ độ khung vẽ). Cạnh chỉ ngang/dọc nên mọi vật cản
  // là hộp chữ nhật. Nhãn số ưu tiên nằm sát NGOÀI cạnh; đụng thì thử phía trong, đẩy xa dần, trượt
  // dọc cạnh; bị đẩy xa thì kẻ đường dẫn về giữa cạnh. Hết chỗ thì lấy chỗ đè ít nhất — phóng to là tách.
  function planLabels(sp, edges) {
    var n = edges.length, H = 20, obs = [], i;

      return s + b.w * b.h - Math.max(0, ix) * Math.max(0, iy); // phần lọt ra ngoài khung cũng tính là đè
    }

    for (i = 0; i < n; i++) obs.push(box(sp[i].x, sp[i].y, 8, 8));

      r.objects = r.objects.filter(function (o) { return o.id !== state.objId; });
      state.objId = null; state.addOpen = false; save(); render();
    },
    delObjPhoto: function (i) { var o = room().objects.find(function (x) { return x.id === state.objId; }); if (o) { dropPhoto(o.photos[i]); o.photos.splice(i, 1); save(); render(); } },
    setWallTotal: function (i, v) { room().edges[i].total = num(v); save(); render(); },

    // ceiling — đồ trần: neo vị trí bằng 2 số đo (Góc/Cạnh) + dài×rộng như đồ tường
    pickCeil: function (k) {
      var r = room();
      var o = { id: uid(), kind: k, ceiling: true, anchor: defaultWallAnchor(r), len: null, w: null, photos: [] };
      copyLastSize(o, CKINDS[k]); r.objects.push(o); state.objId = o.id; state.zoneSel = null; save(); render(); showPlan();
    },
    pickFloor: function (k) { // đồ trên sàn: tạo ngay rồi mở form vị trí
      var r = room();
      var o = { id: uid(), kind: k, floor: true, anchor: defaultWallAnchor(r), len: null, w: null, photos: [] };
      copyLastSize(o, FKINDS[k]); r.objects.push(o); state.objId = o.id; state.selEdge = null; state.pendingVal = ''; save(); render(); showPlan();
    },
    // Chạm vào hình (chỗ trống) khi đang đặt vị trí -> chọn 2 tường gần chỗ chạm nhất
    ceilTap: function (evt) {
      var r = room(), svg = document.getElementById('plan'), t = pickTarget(); if (!r || !svg || !t) return;
      if (state.zoneMode && state.zonePts.length > (state.zoneTwo ? 2 : 1)) return; // đã bò rắn: không đổi neo nữa
      syncForm();
      if (autoWalls(r, t, ceilTransform(r).pxToMm(svgPt(svg, evt.clientX, evt.clientY)))) { if (state.zoneMode) recomputeAnchors(r); save(); render(); }
    },
    planClick: function (evt) {
      var r = room(), svg = document.getElementById('plan'), t = pickTarget(); if (!r || !svg || !t || state.tab !== 'plan') return;
      syncForm();
      if (autoWalls(r, t, planXf(r).pxToMm(svgPt(svg, evt.clientX, evt.clientY)))) { save(); render(); }
    },
    pickWall: function (i) { var r = room(), t = pickTarget(); if (!t) return; syncForm(); assignWall(r, t, i); if (state.zoneMode) recomputeAnchors(r); save(); render(); },
    anchorToWalls: function () { var r = room(), o = curCeil(); if (!o) return; o.anchor = defaultWallAnchor(r, solveAnchorMM(r, o.anchor)); save(); render(); },
    setObjAnchor: function (mi, f, v) {
      var o = curCeil(); if (!o || !o.anchor) return; var m = o.anchor.m[mi];
      if (f === 'idx') { if (Number(v) !== Number(m.idx)) { m.d = ''; if (m.at === 'mep') m.raw = ''; } m.idx = Number(v); m.ref = 'edge'; m.set = true; }
      else if (f === 'd' && m.at === 'mep') m.raw = v; // đo tới mép: giữ số người đo, save() quy ra tâm
      else m[f] = v;
      save(); render();
    },
    // Đồ trần/sàn: số ở dòng mi là đo tới tim hay mép. Con số trong ô GIỮ NGUYÊN, chỉ đổi nghĩa.
    setAncAt: function (mi, mode) {
      var o = curCeil(); if (!o || !o.anchor) return; var m = o.anchor.m[mi];
      if (mode === 'mep' && m.at !== 'mep') { m.raw = m.d; m.at = 'mep'; }
      else if (mode !== 'mep' && m.at === 'mep') { m.d = m.raw != null ? m.raw : ''; delete m.at; delete m.raw; }
      daDoiCo(o); save(); render();
    },
    // Đồ tường: ax 'x' = vị trí ngang tới tim|mép, 'y' = cao từ sàn tới tim|đáy. Số trong ô giữ nguyên, chỉ đổi nghĩa.
    setAt: function (ax, mode) {
      syncForm(); var o = curCeil(); if (!o) return;
      o.at = o.at || {}; o.raw = o.raw || {};
      var fs = ax === 'x' ? ['fromA', 'toB'] : ['h'], was = o.at[ax] === 'tim';
      if (mode === 'tim' && !was) { fs.forEach(function (f) { o.raw[f] = o[f]; }); o.at[ax] = 'tim'; }
      else if (mode !== 'tim' && was) { fs.forEach(function (f) { o[f] = o.raw[f] != null ? o.raw[f] : null; delete o.raw[f]; }); delete o.at[ax]; }
      daDoiCo(o); save(); render();
    },
    setMount: function (v) { var o = curCeil(); if (!o) return; if (v === 'tran') o.mount = 'tran'; else delete o.mount; save(); render(); },
    // Đồ trần trên MẶT ĐỨNG hộp: bật/tắt, chọn cạnh hộp (zk = "id|cạnh"), tường đo, số cách tường, cao sàn->tim.
    setFace: function (f, v) {
      var r = room(), o = curCeil(); if (!o) return;
      if (f === 'on') { if (v === 'face') { if (!o.face && faceZones(r).length) o.face = defaultFace(r); } else delete o.face; }
      else if (o.face) {
        if (f === 'zk') { var q = String(v).split('|'); o.face.z = q[0]; o.face.k = Number(q[1]); fixFaceWall(r, o.face); }
        else if (f === 'wall') { if (Number(v) !== Number(o.face.wall)) o.face.d = null; o.face.wall = Number(v); }
        else o.face[f] = num(v);
      }
      save(); render();
    },
    setObjNum: function (f, v) { var o = curCeil(); if (o) { o[f] = num(v); if (SIZE_F[f]) daDoiCo(o); save(); render(); } },
    // vùng giật cấp (§28) — vẽ viền bằng con rắn
    zoneEditAnc: function (on) { stopSnake(); state.zAncEdit = !!on; render(); },
    zoneStart: function () { stopSnake(); viewReset(); state.zoneMode = true; state.zAncEdit = false; state.zoneTwo = false; state.zoneSel = null; state.ceilPlace = null; state.objId = null; state.zonePts = []; state.zAnc = freshZAnc(room()); state.zActive = 0; snake.mode = 'zone'; snake.legDir = null; snake.legLen = 0; render(); },
    zoneAdd: function (kind) {
      var r = room(), a = defaultWallAnchor(r), z;
      if (kind === 'rect') z = { id: uid(), kind: 'rect', height: '', rect: { v: { idx: a.m[0].idx, d: '' }, h: { idx: a.m[1].idx, d: '' }, sx: '', sy: '' } };
      else z = { id: uid(), kind: 'band', height: '', band: { idx: a.m[1].idx, w: '' } };
      r.zones = r.zones || []; r.zones.push(z); state.zoneSel = z.id; state.objId = null; save(); render(); showPlan();
    },
    setZoneRect: function (f, v) {
      var z = selZoneObj(); if (!z) return;
      if (z.rect) {
        if (f === 'v' || f === 'h') { if (Number(v) !== Number(z.rect[f].idx)) z.rect[f].d = ''; z.rect[f].idx = Number(v); }
        else if (f === 'vd') z.rect.v.d = v; else if (f === 'hd') z.rect.h.d = v; else z.rect[f] = v;
      } else if (z.band) { if (f === 'wall') z.band.idx = Number(v); else z.band[f] = v; }
      save(); render();
    },
    armZone: function (idx) { if (state.zActive !== idx) { state.zActive = idx; render(); } },
    zoneToggleTwo: function () { state.zoneTwo = !state.zoneTwo; recomputeAnchors(room()); render(); },
    zoneCancel: function () { stopSnake(); state.zoneMode = false; state.zonePts = []; snake.mode = 'sketch'; render(); },
    setZAnc: function (idx, mi, f, v) {
      var m = state.zAnc[idx].m[mi]; state.zActive = idx;
      if (f === 'idx') { if (Number(v) !== Number(m.idx)) m.d = ''; m.idx = Number(v); m.ref = 'edge'; m.set = true; } else m[f] = v;
      recomputeAnchors(room()); render();
    },
    zoneClose: function () {
      stopSnake();
      if (snake.legLen > 3) { var h = snakeHead(); if (h) state.zonePts.push({ x: h.x, y: h.y }); }
      snake.legDir = null; snake.legLen = 0;
      if (state.zonePts.length < 3) { alert('Cần điểm bắt đầu + rắn vẽ viền hộp (ít nhất 2 đoạn) rồi hãy đóng.'); return; }
      var r = room();
      var oedges = G.cleanEdges(G.orthogonalize(state.zonePts));
      var scale = ceilTransform(r).scale || 0.1;
      var edges = oedges.map(function (e) { return { axis: e.axis, sign: e.sign, len0: e.len0 / scale, mm: null }; });
      var used = JSON.parse(JSON.stringify(state.zoneTwo ? state.zAnc : [state.zAnc[0]]));
      var startMM = solveAnchorMM(r, used[0]);
      if (state.zoneTwo && edges.length) { var a0 = solveAnchorMM(r, used[0]), a1 = solveAnchorMM(r, used[1]); if (a0 && a1) edges[0].mm = Math.round(Math.hypot(a1.x - a0.x, a1.y - a0.y)); }
      r.zones = r.zones || [];
      var z = { id: uid(), kind: 'free', height: '', anchors: used, start: startMM, edges: edges };
      r.zones.push(z); state.zoneMode = false; state.zonePts = []; snake.mode = 'sketch'; state.zoneSel = z.id; save(); render();
    },
    selZone: function (id) { state.zoneSel = id; state.zoneEdgeSel = null; state.objId = null; state.ceilPlace = null; render(); if (id) showPlan(); },
    selZoneEdge: function (ei) { state.zoneEdgeSel = ei; render(); },
    setZoneEdge: function (ei, v) { var z = (room().zones || []).find(function (x) { return x.id === state.zoneSel; }); if (z && z.edges[ei]) { z.edges[ei].mm = num(v); save(); render(); } },
    setZoneHeight: function (v) { var z = (room().zones || []).find(function (x) { return x.id === state.zoneSel; }); if (z) { z.height = v; save(); render(); } },
    delZone: function () { var r = room(); r.zones = (r.zones || []).filter(function (x) { return x.id !== state.zoneSel; }); state.zoneSel = null; save(); render(); },

    // note+photo theo scope (room / wall)
    setScopeNote: function (scope, idx, v) { var h = scope === 'room' ? room() : room().edges[idx]; h.note = v.trim(); save(); },
    delScopePhoto: function (scope, idx, i) { var h = scope === 'room' ? room() : room().edges[idx]; dropPhoto(h.photos[i]); h.photos.splice(i, 1); save(); render(); },

    cloudOn: function () {
      var c = parseUrl(document.getElementById('cl-code').value), who = document.getElementById('cl-who').value.trim(), err = document.getElementById('cl-err');
      function show(t, cls) { err.style.display = ''; err.className = 'banner ' + (cls || 'bad'); err.textContent = t; }
      if (c.err) return show(c.err);
      c.who = who; show('Đang thử kết nối…', 'info');
      cloudCall({ action: 'ping' }, c).then(function (j) {
        if (j.app !== 'khao-sat') return show('Link này không phải Apps Script của app khảo sát (dán nhầm link app khác?).');
        try { localStorage.setItem(CKEY, JSON.stringify(c)); } catch (e) {}
        cloud.msg = ''; go('home'); loadRemote(); runSync(data.projects.map(function (p) { return p.id; }));
      }, function (e) {
        // bản triển khai còn chạy code cũ (đòi mã bí mật): dán Code.gs mới thôi chưa đủ, phải ra Phiên bản mới
        if (/token/i.test(e.message)) return show('Apps Script đang chạy code CŨ. Dán Code.gs mới > Lưu > Triển khai > Quản lý triển khai > bút chì > Phiên bản: Phiên bản mới > Triển khai.');
        show('Không kết nối được: ' + e.message);
      });
    },
    delProject: function () {
      var p = proj(); if (!p) return;
      var sheet = !!cloudCfg();
      if (!confirm('XOÁ công trình "' + p.name + '" (' + p.rooms.length + ' phòng)?\n\n' +
        (sheet ? 'Xoá khỏi máy này VÀ trên Google Sheet. Thư mục ảnh trên Drive vào thùng rác (khôi phục được 30 ngày).'
               : 'Xoá khỏi máy này. Chưa kết nối Sheet nên không còn bản sao nào khác.') + '\n\nKhông hoàn tác được trên app.')) return;
      projPhotoIds(p).forEach(dropPhoto);
      data.projects = data.projects.filter(function (x) { return x.id !== p.id; });
      if (sheet) { setPendingDel(pendingDel().concat([p.id])); cloud.remote = (cloud.remote || []).filter(function (x) { return x.id !== p.id; }); }
      state.projectId = null; rawSave(); go('home');
      if (sheet) runSync(null);
    },
    cloudOff: function () { if (!confirm('Ngắt kết nối trên máy này? Số đo trên máy và trên Sheet đều giữ nguyên.')) return; try { localStorage.removeItem(CKEY); } catch (e) {} cloud.msg = ''; cloud.remote = null; go('home'); },
    cloudWho: function (v) { var c = cloudCfg(); if (c) { c.who = v.trim(); try { localStorage.setItem(CKEY, JSON.stringify(c)); } catch (e) {} } },
    syncNow: function () {
      if (!cloudCfg()) return;
      runSync(state.projectId ? [state.projectId] : data.projects.map(function (p) { return p.id; })).then(loadRemote);
    },
    pullRemote: function (id) {
      var m = (cloud.remote || []).find(function (x) { return x.id === id; }); if (!m) return;
      var p = { id: id, name: m.name, customer: m.customer || '', rooms: [] };
      p._hash = hashStr(JSON.stringify(projMeta(p))); // chưa sửa gì: không đẩy khung rỗng đè lên Sheet
      data.projects.unshift(p); rawSave(); state.projectId = id; go('project'); runSync([id]);
    },
    camOpen: function (spec) {
      syncForm(); // giữ số đang gõ trong form trước khi mở camera
      if (!camOK() || !photoHolder(spec)) return;
      var box = document.createElement('div'); box.id = 'cam'; box.className = 'cam';
      box.innerHTML = '<video autoplay playsinline muted></video><div class="cam-flash" id="cam-flash"></div>' +
        '<div class="cam-bar"><button class="btn ghost" onclick="App.camClose()">Xong</button>' +
        '<button class="shutter" onclick="App.camShot()" aria-label="Chụp"></button><span class="cam-n" id="cam-n">0 ảnh</span></div>';
      document.body.appendChild(box); cam.spec = spec; cam.n = 0;
      navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false })
        .then(function (st) { cam.stream = st; var v = box.querySelector('video'); if (v) v.srcObject = st; else st.getTracks().forEach(function (t) { t.stop(); }); },
              function (e) { camStop(); alert('Không mở được camera (' + (e && e.name || 'lỗi') + '). Dùng nút "Chọn nhiều ảnh".'); });
    },
    camShot: function () {
      var v = document.querySelector('#cam video'), src = v && camFrame(v), h = photoHolder(cam.spec); if (!src || !h) return;
      var fl = document.getElementById('cam-flash'); if (fl) { fl.style.opacity = 0.8; setTimeout(function () { fl.style.opacity = 0; }, 90); }
      putPhotos([src], function (ids) {
        if (!ids) return; h.photos = h.photos || []; h.photos.push(ids[0]); cam.n++;
        var n = document.getElementById('cam-n'); if (n) n.textContent = cam.n + ' ảnh'; save();
      });
    },
    camClose: function () { camStop(); render(); },
    addPhotos: function (evt, spec) {
      var files = Array.prototype.slice.call(evt.target.files || []); if (!files.length) return;
      syncForm(); var h = photoHolder(spec); if (!h) return;
      readPhotos(files, function (srcs) {
        if (srcs.length < files.length) alert((files.length - srcs.length) + ' ảnh không đọc được, đã bỏ qua.');
        if (!srcs.length) return;
        putPhotos(srcs, function (ids) { if (ids) { h.photos = h.photos || []; Array.prototype.push.apply(h.photos, ids); save(); } render(); });
      });
    },
    exportDXF: function () {
      var r = room(), p = proj(); if (!r || !p) return;
      if (G.missingCount(r.edges) > 0) { alert('Nhập đủ số các cạnh mặt bằng trước khi xuất DXF.'); return; }
      var rr = JSON.parse(JSON.stringify(r));
      rr.elevFlip = !startLeft(r); // mặt đứng DXF cũng nhìn từ TRONG phòng như trên app
      rr.objects.forEach(function (o) {
        if (o.wall != null && !o.ceiling && !o.floor && r.edges[o.wall]) o.fromA = objPosA(o, r.edges[o.wall].mm);
        if (o.floor) o.pos = o.anchor ? solveAnchorMM(r, o.anchor) : null;
      });
      var s = window.DXF && window.DXF.roomToDXF(rr, G);
      if (!s) { alert('Chưa xuất được (thiếu dữ liệu mặt bằng).'); return; }
      var name = (p.name + '-' + r.name).replace(/[^\w\-]+/g, '_');
      var blob = new Blob([s], { type: 'application/dxf' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name + '.dxf'; a.click();
    },
    exportJSON: function () {
      // ảnh trong kho được gói lại thành dataURL -> file JSON tự đủ, nhập sang máy khác vẫn có ảnh
      var json = JSON.stringify(data, function (k, v) { return k === 'photos' && Array.isArray(v) ? v.map(photoSrc) : v; }, 2);
      var blob = new Blob([json], { type: 'application/json' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'khao-sat-' + today() + '.json'; a.click();
    },
    importJSON: function () {
      var inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
      inp.onchange = function () { var f = inp.files[0]; if (!f) return; var rd = new FileReader();
        rd.onload = function () { try { var d = JSON.parse(rd.result); if (!d.projects) throw 0;
          if (confirm('Nhập sẽ THAY dữ liệu hiện tại (' + data.projects.length + ' công trình). Tiếp tục?')) { data = d; migrateInlinePhotos(function () { save(); go('home'); }); }
        } catch (e) { alert('File JSON không hợp lệ.'); } }; rd.readAsText(f); };
      inp.click();
    }
  };
})();
document.addEventListener('DOMContentLoaded', function () {
  App.init();
  // Hình ghim (body.split): bàn phím bật thì trình duyệt hay cuộn CẢ TRANG để lộ ô đang gõ -> hình chui dưới
  // thanh tiêu đề. Giữ trang đứng yên, chỉ cuộn khung nhập (#pane) tới ô đang gõ.
  function keepSplit() {
    if (!document.body.classList.contains('split')) return;
    var a = document.activeElement, pn = document.getElementById('pane');
    if (a && pn && pn.contains(a)) {
      var ar = a.getBoundingClientRect(), pr = pn.getBoundingClientRect();
      if (ar.bottom > pr.bottom - 8) pn.scrollTop += ar.bottom - pr.bottom + 16;
      else if (ar.top < pr.top + 8) pn.scrollTop -= pr.top - ar.top + 16;
    }
    if (window.scrollY) window.scrollTo(0, 0);
  }
  window.addEventListener('resize', keepSplit);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', keepSplit);
  window.addEventListener('scroll', function () { if (document.body.classList.contains('split') && window.scrollY) keepSplit(); });
  document.addEventListener('focusin', function () { setTimeout(keepSplit, 350); });
  if (location.protocol.indexOf('http') === 0) {
    var lk = document.createElement('link'); lk.rel = 'manifest'; lk.href = 'manifest.json'; document.head.appendChild(lk);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  }
});
</script>
